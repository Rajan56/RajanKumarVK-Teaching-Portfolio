name: One-time setup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy unchanged files and build the teaching case
        run: |
          set -e
          if [ -f cases/margin-recovery/index.html ]; then echo "Already set up"; exit 0; fi
          SRC=https://raw.githubusercontent.com/Rajan56/Teaching-Portfolio_RajanVK/main
          mkdir -p css js assets video cases/margin-recovery
          for f in LICENSE .nojekyll css/style.css js/main.js js/iem.js assets/poster-1.jpg assets/poster-4.jpg video/01-learning-is-insight.mp4 video/01-learning-is-insight.vtt video/04-ask-before-telling.mp4 video/04-ask-before-telling.vtt; do
            curl -fsSL "$SRC/$f" -o "$f"
          done
          curl -fsSL https://raw.githubusercontent.com/Rajan56/margin-recovery-case/main/index.html -o /tmp/case.html
          python3 - <<'PY'
          import json,base64
          R=json.loads(base64.b64decode("").decode())
          s=open('/tmp/case.html',encoding='utf8').read()
          for a,b in R:
              assert a in s, a[:60]
              s=s.replace(a,b)
          open('cases/margin-recovery/index.html','w',encoding='utf8').write(s)
          print('teaching case built', len(s))

          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy unchanged portfolio files and add the teaching case"
          git push
